title: "Take Back Your Data"
tagline: "Essays on data as property, individual rights, and the economics of the personal information economy."
description: "A publication arguing that your data is your property, and building the economic, legal, and political case for why that matters."
author:
  name: "Roman Belaire"

url: "https://takebackyourdata.org"
baseurl: ""

permalink: /essays/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: /feed.xml

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - .gitignore
